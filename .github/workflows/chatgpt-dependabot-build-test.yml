name: ChatGPT Dependabot Electron test

on:
  push:
    branches:
      - chatgpt/dependabot-build-test
    paths-ignore:
      - chatgpt-dependabot-build-report.md
      - chatgpt-dependabot-electron-report.md
  pull_request:
    branches:
      - main
    paths-ignore:
      - chatgpt-dependabot-build-report.md
      - chatgpt-dependabot-electron-report.md

permissions:
  contents: read

jobs:
  electron-linux:
    name: "electron-linux ${{ matrix.target }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - main
          - "1073"
          - "1072"
          - "1071"
          - "1068"
          - "1067"
          - "1066"
          - "1065"
          - "1064"
          - "1063"
          - "1062"
          - "1061"
          - "1060"
          - "1059"
          - "1055"
          - "1043"
          - "1040"
    steps:
      - name: Check out target
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target == 'main' && 'main' || format('refs/pull/{0}/head', matrix.target) }}
          persist-credentials: false

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install, package, and launch
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          HUSKY: "0"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          mkdir -p ci-result
          install=success
          package=skipped
          smoke=skipped

          npm ci >ci-result/install.log 2>&1 || install=failure
          if [[ "$install" == success ]]; then
            package=success
            npm run electron:build -- --linux --dir -p never >ci-result/package.log 2>&1 || package=failure
          fi

          if [[ "$package" == success ]]; then
            exe="dist_electron/linux-unpacked/ChatALL"
            if [[ ! -x "$exe" ]]; then
              exe="$(find dist_electron -path '*/linux-unpacked/*' -maxdepth 4 -type f -perm -111 2>/dev/null | grep -Ev '/(chrome-sandbox|chrome_crashpad_handler|libEGL|libGLES|libffmpeg|snapshot_blob|v8_context_snapshot)' | head -n 1 || true)"
            fi

            if [[ -z "$exe" || ! -x "$exe" ]]; then
              smoke=failure
              echo "Could not locate packaged executable." >ci-result/smoke.log
            else
              if ! command -v xvfb-run >/dev/null 2>&1; then
                sudo apt-get update >ci-result/xvfb-install.log 2>&1
                sudo apt-get install -y xvfb >>ci-result/xvfb-install.log 2>&1
              fi

              smoke=success
              setsid xvfb-run -a "$exe" --no-sandbox --disable-gpu >ci-result/smoke.log 2>&1 &
              pid=$!
              sleep 12
              if kill -0 "$pid" 2>/dev/null; then
                kill -TERM -- "-$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
              else
                wait "$pid" || rc=$?
                echo "Application exited before the 12-second smoke window (status ${rc:-0})." >>ci-result/smoke.log
                smoke=failure
              fi
            fi
          fi

          export INSTALL_STATUS="$install" PACKAGE_STATUS="$package" SMOKE_STATUS="$smoke"
          export TARGET_SHA="$(git rev-parse HEAD)"
          python3 - <<'PY'
          import json, os
          result = {
              "target": os.environ["TARGET"],
              "sha": os.environ["TARGET_SHA"],
              "install": os.environ["INSTALL_STATUS"],
              "package": os.environ["PACKAGE_STATUS"],
              "smoke": os.environ["SMOKE_STATUS"],
          }
          with open("ci-result/result.json", "w", encoding="utf-8") as f:
              json.dump(result, f, indent=2)
          PY

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-result-${{ matrix.target }}
          path: ci-result/
          retention-days: 1

  report:
    name: Compile Electron report
    if: always()
    needs:
      - electron-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out report branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/dependabot-build-test

      - name: Download results
        uses: actions/download-artifact@v4
        with:
          pattern: electron-result-*
          path: ci-results/electron

      - name: Compile Markdown report
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import datetime
          import json
          from pathlib import Path

          order = [
              "main", "1073", "1072", "1071", "1068", "1067", "1066",
              "1065", "1064", "1063", "1062", "1061", "1060", "1059",
              "1055", "1043", "1040",
          ]

          results = {}
          for result_file in Path("ci-results/electron").glob("**/result.json"):
              data = json.loads(result_file.read_text(encoding="utf-8"))
              results[data["target"]] = (data, result_file.parent)

          lines = [
              "# Dependabot PR Electron report",
              "",
              f"Generated: {datetime.datetime.now(datetime.timezone.utc).isoformat()}",
              "",
              "Environment: GitHub-hosted Ubuntu runner, Node.js 20, clean `npm ci`, unpacked Linux Electron package, 12-second Xvfb launch smoke test.",
              "",
              "| Target | Commit | `npm ci` | Electron package | Launch smoke |",
              "|---|---|---|---|---|",
          ]

          for target in order:
              item = results.get(target)
              if not item:
                  lines.append(f"| {target} | — | missing | missing | missing |")
                  continue
              data, _ = item
              lines.append(
                  f"| {target} | `{data['sha'][:12]}` | {data['install']} | {data['package']} | {data['smoke']} |"
              )

          failures = []
          for target, (data, folder) in results.items():
              for step in ("install", "package", "smoke"):
                  if data.get(step) == "failure":
                      failures.append((target, step, folder / f"{step}.log"))

          if failures:
              lines.extend(["", "## Failure excerpts", ""])
              for target, step, logfile in sorted(failures):
                  lines.extend([f"### {target}: {step}", "", "```text"])
                  if logfile.exists():
                      text = logfile.read_text(encoding="utf-8", errors="replace").splitlines()
                      lines.extend(text[-120:])
                  else:
                      lines.append("Log file was not produced.")
                  lines.extend(["```", ""])

          Path("chatgpt-dependabot-electron-report.md").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          PY

      - name: Commit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-dependabot-electron-report.md
          if ! git diff --cached --quiet; then
            git commit -m "ci: record Dependabot Electron results"
            git push origin HEAD:chatgpt/dependabot-build-test
          fi
