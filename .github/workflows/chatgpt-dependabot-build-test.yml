name: ChatGPT Dependabot build test

on:
  push:
    branches:
      - chatgpt/dependabot-build-test
    paths-ignore:
      - chatgpt-dependabot-build-report.md

permissions:
  contents: write

jobs:
  web-build:
    name: "web ${{ matrix.target }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - main
          - "1073"
          - "1072"
          - "1071"
          - "1068"
          - "1067"
          - "1066"
          - "1065"
          - "1064"
          - "1063"
          - "1062"
          - "1061"
          - "1060"
          - "1059"
          - "1055"
          - "1043"
          - "1040"
    steps:
      - name: Check out target
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target == 'main' && 'main' || format('refs/pull/{0}/head', matrix.target) }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install, build, and lint
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          HUSKY: "0"
        run: |
          mkdir -p ci-result
          install=success
          build=skipped
          lint=skipped

          npm ci >ci-result/install.log 2>&1 || install=failure
          if [[ "$install" == success ]]; then
            build=success
            npm run build >ci-result/build.log 2>&1 || build=failure

            lint=success
            npm run lint >ci-result/lint.log 2>&1 || lint=failure
          fi

          export INSTALL_STATUS="$install" BUILD_STATUS="$build" LINT_STATUS="$lint"
          export TARGET_SHA="$(git rev-parse HEAD)"
          python3 - <<'PY'
          import json, os
          result = {
              "kind": "web",
              "target": os.environ["TARGET"],
              "sha": os.environ["TARGET_SHA"],
              "install": os.environ["INSTALL_STATUS"],
              "build": os.environ["BUILD_STATUS"],
              "lint": os.environ["LINT_STATUS"],
          }
          with open("ci-result/result.json", "w", encoding="utf-8") as f:
              json.dump(result, f, indent=2)
          PY

      - name: Upload web result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-result-${{ matrix.target }}
          path: ci-result/
          retention-days: 1

  electron-linux-package:
    name: "electron-linux ${{ matrix.target }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - main
          - "1068"
          - "1043"
    steps:
      - name: Check out target
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target == 'main' && 'main' || format('refs/pull/{0}/head', matrix.target) }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and package Linux Electron app
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          HUSKY: "0"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          mkdir -p ci-result
          install=success
          package=skipped

          npm ci >ci-result/install.log 2>&1 || install=failure
          if [[ "$install" == success ]]; then
            package=success
            npm run electron:build -- --linux --dir -p never >ci-result/package.log 2>&1 || package=failure
          fi

          export INSTALL_STATUS="$install" PACKAGE_STATUS="$package"
          export TARGET_SHA="$(git rev-parse HEAD)"
          python3 - <<'PY'
          import json, os
          result = {
              "kind": "electron-linux",
              "target": os.environ["TARGET"],
              "sha": os.environ["TARGET_SHA"],
              "install": os.environ["INSTALL_STATUS"],
              "package": os.environ["PACKAGE_STATUS"],
          }
          with open("ci-result/result.json", "w", encoding="utf-8") as f:
              json.dump(result, f, indent=2)
          PY

      - name: Upload Electron result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-result-${{ matrix.target }}
          path: ci-result/
          retention-days: 1

  report:
    name: Compile build report
    if: always()
    needs:
      - web-build
      - electron-linux-package
    runs-on: ubuntu-latest
    steps:
      - name: Check out report branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/dependabot-build-test

      - name: Download web results
        uses: actions/download-artifact@v4
        with:
          pattern: web-result-*
          path: ci-results/web

      - name: Download Electron results
        uses: actions/download-artifact@v4
        with:
          pattern: electron-result-*
          path: ci-results/electron

      - name: Compile Markdown report
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import datetime
          import json
          from pathlib import Path

          web_order = [
              "main", "1073", "1072", "1071", "1068", "1067", "1066",
              "1065", "1064", "1063", "1062", "1061", "1060", "1059",
              "1055", "1043", "1040",
          ]
          electron_order = ["main", "1068", "1043"]

          def load_results(root: str) -> dict[str, tuple[dict, Path]]:
              loaded = {}
              for result_file in Path(root).glob("**/result.json"):
                  data = json.loads(result_file.read_text(encoding="utf-8"))
                  loaded[data["target"]] = (data, result_file.parent)
              return loaded

          web = load_results("ci-results/web")
          electron = load_results("ci-results/electron")
          lines = [
              "# Dependabot PR build report",
              "",
              f"Generated: {datetime.datetime.now(datetime.timezone.utc).isoformat()}",
              "",
              "Environment: GitHub-hosted Ubuntu runner, Node.js 20, clean `npm ci`.",
              "",
              "The repository has no automated test script. The checks below cover dependency installation, Vue production build, ESLint, and selected Linux Electron packaging.",
              "",
              "## Web build and lint",
              "",
              "| Target | Commit | `npm ci` | `npm run build` | `npm run lint` |",
              "|---|---|---|---|---|",
          ]

          for target in web_order:
              item = web.get(target)
              if not item:
                  lines.append(f"| {target} | — | missing | missing | missing |")
                  continue
              data, _ = item
              lines.append(
                  f"| {target} | `{data['sha'][:12]}` | {data['install']} | {data['build']} | {data['lint']} |"
              )

          lines.extend([
              "",
              "## Linux Electron packaging",
              "",
              "| Target | Commit | `npm ci` | unpacked Linux package |",
              "|---|---|---|---|",
          ])
          for target in electron_order:
              item = electron.get(target)
              if not item:
                  lines.append(f"| {target} | — | missing | missing |")
                  continue
              data, _ = item
              lines.append(
                  f"| {target} | `{data['sha'][:12]}` | {data['install']} | {data['package']} |"
              )

          failures: list[tuple[str, str, str, Path]] = []
          for target, (data, folder) in web.items():
              for step in ("install", "build", "lint"):
                  if data.get(step) == "failure":
                      failures.append(("web", target, step, folder / f"{step}.log"))
          for target, (data, folder) in electron.items():
              for step, filename in (("install", "install.log"), ("package", "package.log")):
                  if data.get(step) == "failure":
                      failures.append(("electron-linux", target, step, folder / filename))

          if failures:
              lines.extend(["", "## Failure excerpts", ""])
              for kind, target, step, logfile in sorted(failures):
                  lines.append(f"### {kind} {target}: {step}")
                  lines.append("")
                  if logfile.exists():
                      text = logfile.read_text(encoding="utf-8", errors="replace").splitlines()
                      excerpt = text[-100:]
                      lines.append("```text")
                      lines.extend(excerpt)
                      lines.append("```")
                  else:
                      lines.append("Log file was not produced.")
                  lines.append("")

          Path("chatgpt-dependabot-build-report.md").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          PY

      - name: Commit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-dependabot-build-report.md
          if ! git diff --cached --quiet; then
            git commit -m "ci: record Dependabot build results"
            git push origin HEAD:chatgpt/dependabot-build-test
          fi
